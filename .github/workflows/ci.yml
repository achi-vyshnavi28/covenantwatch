name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t covenantwatch .
      - name: API starts, runs the monitor and serves alerts (keyword fallback, no API key)
        run: |
          docker run -d -p 8901:8901 --name cw covenantwatch
          for i in $(seq 1 30); do curl -sf localhost:8901/health && break; sleep 2; done
          curl -sf --max-time 300 -X POST "localhost:8901/run?as_of=2027-03-31" && curl -sf --max-time 30 localhost:8901/alerts | head -c 400
